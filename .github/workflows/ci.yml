# Tests for pg-launch-check itself.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest
      - name: Scan the demo project (before must find issues, after must be clean)
        shell: bash
        run: |
          python examples/make_demo.py /tmp/demo-pg-app
          pg-launch-check scan /tmp/demo-pg-app/before --no-color && exit 1 || test $? -eq 1
          pg-launch-check scan /tmp/demo-pg-app/after --no-color --fail-on info
      - name: Clean fixtures must pass
        run: pg-launch-check scan tests/fixtures/sql_clean tests/fixtures/prisma_clean tests/fixtures/node_clean tests/fixtures/py_clean --no-color --include-tests --fail-on info
